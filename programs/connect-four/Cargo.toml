[package]
name = "connect-four"
version = "0.1.0"
description = "Two-player Connect Four with USDC wagers, played on a MagicBlock Ephemeral Rollup and settled on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "connect_four"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.2", features = ["token", "associated_token"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
