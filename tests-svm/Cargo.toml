[package]
name = "connect-four-svm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate (own lockfile) so MagicSVM's Solana crate versions don't clash with the
# program's Anchor dependency tree. Loads ../target/deploy/connect_four.so.
[dev-dependencies]
magicsvm = "0.3.0"
magicblock-account = "4.3.1"
ephemeral-rollups-sdk = { version = "0.14.4", features = ["modular-sdk"] }
solana-account = "4.3.1"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-program-pack = "3.1.0"
solana-rent = "~4.3.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
solana-transaction-error = "~3.3.1"
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "3.0.0"
sha2 = "0.10"
borsh = { version = "1.6.1", features = ["derive"] }
